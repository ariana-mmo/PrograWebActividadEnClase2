<!DOCTYPE html>
<html lang = "en">
<head>
<meta charset="UTF-8">
<meta name = "viewport" content = "width=device-width, initial-scale=1.0">
<title>Ejercicio 2</title>
</head>
<body>
    <h1>Formulario de Registro</h1>

    <form>
        <label for="codigo">Codigo:</label>
        <input type="text" id="codigo" id="codigo" required>
        <br/>
        <label for="nombres">Nombres:</label> 
        <input type="text" id="nombres" id="nombres" required>
        <br/>
        <label for="apellidos">Apellidos:</label> 
        <input type="text" id="apellidos" id="apellidos" required>
        <br/>
        <label for="correo">Correo Electrónico:</label> 
        <input type="email" id="correo" id="correo" required>
        <br/>
        Género
        <label for="g_masculino">Masculino:</label>
        <input type="radio" id="g_masculino" name="gen" value="M" />
        <label for="g_femenino">Femenino:</label>
        <input type="radio" id="g_femenino" name="gen" value="F" />
        <label for="g_otro">Otro:</label>
        <input type="radio" id="g_otro" name="gen" value="O" />
        <br/>
        Intereses:
        <br />
        <label for="intereses1">Ingeniería de Software:</label>
        <input type="checkbox" id="intereses1" name="intereses1" value="SE" />
        <br />
        <label for="intereses2">Ciencias:</label>
        <input type="checkbox" id="intereses2" name="intereses2" value="CS" />
        <br />
        <label for="intereses3">Inteligencia Artificial:</label>
        <input type="checkbox" id="intereses3" name="intereses3" value="AI" />
        <br />
        <label for="intereses4">Data:</label>
        <input type="checkbox" id="intereses4" name="intereses4" value="DS" />
        <br />

        Semestre de Inicio:
        <select id="inicio" name="inicio">
            <option>2026-1</option>
            <option>2026-2</option>
        </select>
        <br />
        
        <input type="submit" />
    </form>


<body>
</html>
